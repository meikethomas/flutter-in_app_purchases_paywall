name: example
description: A new Flutter project.

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.11.0 <4.0.0"
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_countdown_timer: ^4.1.0
  in_app_purchases_paywall_ui:
    path: ../packages/in_app_purchases_paywall_ui
  in_app_purchases_intl:
    path: ../packages/in_app_purchases_intl
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

dependency_overrides:
  in_app_purchases_interface:
    path: ../packages/in_app_purchases_interface
  in_app_purchases_intl:
    path: ../packages/in_app_purchases_intl
  in_app_purchases_paywall_ui:
    path: ../packages/in_app_purchases_paywall_ui

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  # Keep this example on its existing CocoaPods integration.
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  assets:
    - assets/images/
